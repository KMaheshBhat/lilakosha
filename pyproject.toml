[project]
name = "lilakosha"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.0",
    "duckdb>=1.5.5",
    "huggingface-hub>=1.19.0",
    "jinja2>=3.1.6",
    "lingua-language-detector>=2.2.0",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "tqdm>=4.68.2",
    "uuid-utils>=0.16.0",
]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] # Error, Pyflakes, Isort
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]
