# LilaKosha-MK1: Introspection & Refinement Blueprint

pipeline:
    - "refine-cdm-language"

project:
    name: "LilaKosha"
    mark: "MK1"
    generation: "G1"

volumes:
    raw: "${LILAKOSHA_VOLUME_RAW}"
    processed: "${LILAKOSHA_VOLUME_PROCESSED}"

parameters:
    min_language_confidence: 0.05
    cdm_language_target:
        - kind: "turn"
          variants:
            - "original"
        - kind: "narrative"
          variants:
            - "original"
