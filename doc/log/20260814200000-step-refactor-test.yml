# LilaKosha-MK1: Smoke Test Blueprint
pipeline:
    - "init"
    - "ingest-pippa"
    - "ingest-gutenberg-62"
    - "ingest-lemonilia-rpgnet"
    - "refine-pippa-characters-v2"
    - "refine-pippa-safety-dials-v2"
    - "refine-pippa-genre-theme-v2"
    - "refine-pippa-grammar-v2"
    - "refine-cdm-html-to-markdown-v2"
    - "refine-cdm-language-v2"
    - "report-cdm-records"
    - "report-cdm"

project:
    name: "LilaKosha"
    mark: "MK1"

volumes:
    raw: "${LILAKOSHA_VOLUME_RAW}" # Unified landing zone
    processed: "${LILAKOSHA_VOLUME_PROCESSED}" # Recap-augmented output
    models: "${LILAKOSHA_VOLUME_MODELS}"
    exports: "${LILAKOSHA_VOLUME_EXPORTS}"

services:
    local:
        provider: openai-compatible
        base_url: "${LILAKOSHA_SERVICE_LOCAL}"
        api_key: dummy
        model: local
    openrouter:
        provider: openai-compatible
        base_url: https://openrouter.ai/api/v1
        api_key: "${OPENROUTER_API_KEY}"
        model: "nvidia/nemotron-3-ultra-550b-a55b:free"
        requests_per_minute: 20
    kilo:
        provider: openai-compatible
        base_url: https://api.kilo.ai/api/gateway
        api_key: "${KILO_API_KEY}"
        model: "nvidia/nemotron-3-ultra-550b-a55b:free"
        requests_per_minute: 20
    groq:
        provider: openai-compatible
        base_url: https://api.groq.com/openai/v1
        api_key: "${GROQ_API_KEY}"
        model: "openai/gpt-oss-120b"
        requests_per_minute: 3
    google-gemini:
        provider: openai-compatible
        base_url: https://generativelanguage.googleapis.com/v1beta/openai/
        api_key: "${GEMINI_API_KEY}"
        model: "gemini-3.1-flash-lite"
        requests_per_minute: 12
    google-gemma:
        provider: openai-compatible
        base_url: https://generativelanguage.googleapis.com/v1beta/openai/
        api_key: "${GEMINI_API_KEY}"
        model: "gemma-4-31b-it"
        requests_per_minute: 12
        allows_think_control: false
        allows_extra_body: false
    cerebras:
        provider: openai-compatible
        base_url: https://api.cerebras.ai/v1
        api_key: "${CEREBRAS_API_KEY}"
        model: "gemma-4-31b"
        requests_per_minute: 5
        retry_on_rate_limit: true
        allows_extra_body: false
    nvidia:
        provider: openai-compatible
        base_url: https://integrate.api.nvidia.com/v1
        api_key: "${NVIDIA_API_KEY}"
        model: "nvidia/nemotron-3-ultra-550b-a55b"
        # model: "nvidia/nemotron-3-super-120b-a12b"
        allows_extra_body: false
        requests_per_minute: 31
        retry_on_rate_limit: true

bindings:
    refine-pippa-characters:
        service: local
        temperature: 0.1
        max_tokens: 4096

    refine-pippa-safety-dials:
        service: local
        temperature: 0.1
        max_tokens: 2048

    refine-pippa-genre-theme:
        service: local
        temperature: 0.1
        max_tokens: 2048

    refine-pippa-grammar:
        service: local
        temperature: 0.0
        max_tokens: 2048

parameters:
    limit: 5
    report_sections:
      - health
      - stats
      - items
      - char_names
    report_hide_anomaly_details: true
    report_breakdown: true

