# LilaKosha-MK1: Unified CDM Report Test
pipeline:
    - "report-cdm"

project:
    name: "LilaKosha"
    mark: "MK1"
    generation: "G1"

volumes:
    processed: "${LILAKOSHA_VOLUME_PROCESSED}"

parameters:
    report_sections:
      - health
      - stats
      - items
      # - char_names # this was tested separately and it works - excluded for full corpus run
    report_hide_anomaly_details: true
    report_breakdown: true

